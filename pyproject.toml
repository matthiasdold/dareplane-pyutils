[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dareplane_utils"
version = "0.0.23"
authors = [{ name = "Matthias Dold", email = "matthias.dold@gmx.net" }]
description = "Default utilities for the dareplane platform"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "colorlog >= 6.8.2",
  "contourpy >= 1.2.1",
  "coverage >= 7.5.3",
  "cycler >= 0.12.1",
  "fonttools >= 4.53.0",
  "fire",
  "iniconfig >= 2.0.0",
  "kiwisolver >= 1.4.5",
  "matplotlib >= 3.9.0",
  "numpy >= 1.26.4",
  "packaging >= 24.0",
  "pillow >= 10.3.0",
  "pluggy >= 1.5.0",
  "psutil >= 5.9.8",
  "pylsl >= 1.16.2",
  "pyparsing >= 3.1.2",
  "python-dateutil >= 2.9.0",
  "scipy >= 1.13.1",
  "six >= 1.16.0",
  "ujson >= 5.10.0",
  "xmltodict >= 0.13.0",
]

[project.optional-dependencies]
dev = ["pytest >= 8.2.2", "ruff"]
# griffe is pinned because quartodoc has no renderer for the numpy "Methods"
# docstring section that newer griffe versions emit as DocstringSectionFunctions
docs = ["quartodoc >= 0.7.2", "griffe < 1.0"]

[project.urls]
"homepage" = "https://github.com/matthiasdold/dareplane-pyutils"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PIE", # flake8-pie
  "TRY", # tryceratops
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line-too-long; formatter owns wrapping, and docstrings exceed it
  "TRY003", # long messages outside exception class; used deliberately here
  "TRY300", # return-in-try-else; hurts readability in the socket handlers
  "RUF012", # ClassVar annotations not used in this codebase
]

[tool.ruff.lint.per-file-ignores]
# Unpacked-but-unused fixture/setup tuples and mutable defaults are idiomatic
# in these tests; blind excepts guard best-effort teardown of sockets/processes.
"tests/**" = ["B006", "B008", "RUF059", "BLE001", "S110"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
# resources/ holds server entry points launched as subprocesses, not tests
norecursedirs = ["tests/resources"]
filterwarnings = ["ignore:::.*fire.core"]
