# The published version comes from the git tag via setuptools-scm - there is no
# version to bump in pyproject.toml.
#
# To create a release and trigger this workflow:
#   1. Tag the commit:  git tag v0.0.24
#   2. Push the tag:    git push origin v0.0.24
#   3. Create release:  gh release create v0.0.24 --title "v0.0.24" --generate-notes

name: Build and Publish Python Package

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # These permissions are required for PyPI Trusted Publishing (OIDC)
    permissions:
      id-token: write  # Required to authenticate with PyPI
      contents: read   # Required to checkout the code

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          # setuptools-scm derives the version from `git describe`; the default
          # shallow checkout has no tags and would yield a 0.1.dev* version
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x' # Uses the latest stable Python 3 release

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the package (sdist and wheel)
        run: python -m build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
