name: Dareplane utils pytest

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10   # should be sufficient with current local run  ~1.5min
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macos-latest,
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
      - name: Install liblsl Unix  # should come with pylsl for windows
        if: matrix.os != 'windows-latest'
        run: |
          wget https://github.com/sccn/liblsl/releases/download/v1.16.2/liblsl-1.16.2-bionic_amd64.deb
          sudo apt install ./liblsl*.deb
        continue-on-error: true
      - name: Lint with Ruff
        run: |
          ruff check --output-format=github --target-version=py310 .
        continue-on-error: true
      - name: Test with pytest
        run: pytest . -vv
        env:
          # Runners are slower than a dev machine - allow more grace for the
          # test servers to stop before the teardown reports a stuck thread.
          DP_TEST_SHUTDOWN_TIMEOUT_S: ${{ matrix.os == 'windows-latest' && '20' || '15' }}
      # run: coverage run -m pytest -v -s
      # - name: Generate test report
      #   run: coverage report -m
